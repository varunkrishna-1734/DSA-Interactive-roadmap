<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSA Interactive Roadmap</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#172033}
header{padding:24px 28px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}
h1{margin:0 0 6px;font-size:28px}.sub{color:#667085}
#app{padding:28px;max-width:1250px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input{padding:11px 14px;border:1px solid #d0d5dd;border-radius:10px;width:300px;font-size:15px}
button{border:1px solid #d0d5dd;background:white;padding:10px 14px;border-radius:9px;cursor:pointer}
button:hover{background:#f0f2f5}.tree{display:grid;gap:12px}.topic{background:#fff;border:1px solid #e4e7ec;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #00000008}
.row{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}.arrow{width:20px;font-size:18px}
.name{font-weight:750;flex:1}.count{color:#667085;font-size:14px}.badge{padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3446a3;font-size:12px}
.children{display:none;padding:0 18px 18px 50px}.topic.open>.children{display:grid;gap:9px}
.subtopic{border-left:2px solid #d0d5dd;padding-left:14px;background:#fafafa;border-radius:8px}
.subrow{display:flex;gap:10px;align-items:center;padding:11px;cursor:pointer}.subchildren{display:none;padding:0 12px 12px 36px}.subtopic.open .subchildren{display:grid;gap:7px}
.method{padding:10px 12px;background:#fff;border:1px solid #eaecf0;border-radius:8px;cursor:pointer}
.method:hover{border-color:#98a2b3}
.detail{margin-top:22px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:22px;display:none}.detail h2{margin-top:0}
.problem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.problem:last-child{border:0}
.problem input{width:auto}.num{width:30px;color:#667085}.pname{flex:1}.pname a{color:#3157c9;text-decoration:none;font-weight:650}.pname a:hover{text-decoration:underline}.diff{font-size:12px;padding:3px 7px;border-radius:7px;background:#f2f4f7}
.progress{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#4f46e5}
.note{font-size:13px;color:#667085;margin-top:15px}
</style>
</head>
<body>

<div id="app">
<div class="toolbar"><input id="search" placeholder="Search topic, method or problem..."><button onclick="expandAll()">Expand all</button><button onclick="collapseAll()">Collapse all</button><button onclick="resetProgress()">Reset progress</button></div>
<div id="tree" class="tree"></div>
<div id="detail" class="detail"></div>
</div>

const key="dsa-roadmap-progress-v1";
let progress=JSON.parse(localStorage.getItem(key)||"{}");

function topicHTML(t){
 let [id,name,subs]=t;
 return `<section class="topic" data-search="${name.toLowerCase()}">
 <div class="row" onclick="toggle(this.parentElement)"><span class="arrow">▶</span><span class="name">${id}. ${name}</span><span class="count">${countProblems(subs)} problems</span><span class="badge">${subs.length} subtopics</span></div>
 <div class="children">${subs.map((s,i)=>subHTML(name,s,i)).join("")}</div></section>`;
}
function subHTML(topic,s,i){
 let [name,methods,problems]=s;
 return `<div class="subtopic" data-search="${(topic+" "+name+" "+methods.join(" ")+" "+problems.join(" ")).toLowerCase()}">
 <div class="subrow" onclick="toggle(this.parentElement)"><span class="arrow">▶</span><b>${name}</b><span class="count">${problems.length} problems</span></div>
 <div class="subchildren">
   <div class="note"><b>Methods / patterns:</b></div>
   ${methods.map(m=>`<div class="method" onclick='showDetail(${JSON.stringify(topic)},${JSON.stringify(name)},${JSON.stringify(m)},${JSON.stringify(problems)})'>${m}</div>`).join("")}
 </div></div>`;
}
function countProblems(subs){return subs.reduce((a,s)=>a+s[2].length,0)}
function toggle(el){el.classList.toggle("open");el.querySelector(".arrow").textContent=el.classList.contains("open")?"▼":"▶"}
function render(){document.getElementById("tree").innerHTML=data.map(topicHTML).join("")}
function showDetail(topic,sub,method,problems){
 let d=document.getElementById("detail"); d.style.display="block";
 d.innerHTML=`<h2>${topic} → ${sub} → ${method}</h2><div class="note">${problems.length} problems covered in this subtopic.</div>
 <div class="progress"><div class="bar" style="width:${problems.filter((_,i)=>progress[topic+"|"+sub+"|"+i]).length/problems.length*100}%"></div></div>
 ${problems.map((p,i)=>{let k=topic+"|"+sub+"|"+i;let u=links[p];let name=u?`<a href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${p} ↗</a>`:`${p}`;return `<div class="problem"><input type="checkbox" ${progress[k]?"checked":""} onchange="setProgress('${k}',this.checked)"><span class="num">${i+1}.</span><span class="pname">${name}</span><span class="diff">${i%3===0?"Easy":i%3===1?"Medium":"Hard"}</span></div>`}).join("")}
 <div class="note">Problem names here are a starter roadmap. You can edit this single HTML file later to add your own full list.</div>`;
 d.scrollIntoView({behavior:"smooth",block:"start"});
}
function setProgress(k,v){if(v)progress[k]=1;else delete progress[k];localStorage.setItem(key,JSON.stringify(progress));}
function expandAll(){document.querySelectorAll(".topic,.subtopic").forEach(x=>{x.classList.add("open");x.querySelector(".arrow").textContent="▼"})}
function collapseAll(){document.querySelectorAll(".topic,.subtopic").forEach(x=>{x.classList.remove("open");x.querySelector(".arrow").textContent="▶"})}
function resetProgress(){progress={};localStorage.removeItem(key);location.reload()}
document.getElementById("search").addEventListener("input",e=>{
 let q=e.target.value.toLowerCase().trim();
 document.querySelectorAll(".topic").forEach(t=>{
   let hit=!q||t.dataset.search.includes(q)||[...t.querySelectorAll(".subtopic")].some(s=>s.dataset.search.includes(q));
   t.style.display=hit?"block":"none";
   if(q){t.classList.add("open");t.querySelector(".arrow").textContent="▼";
     t.querySelectorAll(".subtopic").forEach(s=>{let sh=s.dataset.search.includes(q);s.style.display=sh?"block":"none";if(sh){s.classList.add("open");s.querySelector(".arrow").textContent="▼"}})
   } else t.querySelectorAll(".subtopic").forEach(s=>s.style.display="block");
 })
});
render();
